name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC

jobs:
  analyze:
    name: codeql analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "kotlin"]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Autobuild ran a full release build (R8), which fails on the sqlite-jdbc and
      # slf4j classes. Kotlin is compiled by hand instead; Python needs no build.
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.language == 'kotlin' && 'manual' || 'none' }}
      - if: matrix.language == 'kotlin'
        run: |
          cd android
          ./gradlew --no-daemon :engine:classes :app:compileMlkitDebugKotlin
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
