[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oarumi"
version = "0.1.0a3"
description = "Oarumi — a universal interlingua with a deterministic, offline, tri-modal engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "The Oarumi Authors" }]
keywords = ["conlang", "interlingua", "nsm", "accessibility", "offline"]

dependencies = [
  "pyside6>=6.6,<7",
  "argostranslate>=1.9",
  "pyttsx3>=2.90",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "ruff>=0.4",
  "black>=24.3",
  "mypy>=1.9",
  "types-pyyaml",
  "pip-tools>=7.4",
  "pytest-xdist>=3.5",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "pytest-asyncio>=0.23",
]

[project.scripts]
oarumi         = "tools.cli:main"
oarumi-desktop = "desktop.app:main"
oarumi-parity  = "tools.parity_web.server:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where   = ["engine/python", "."]
include = [
    "oarumi", "oarumi.*",
    "desktop", "desktop.*",
    "tools",
    "tools.parity_web", "tools.parity_web.*",
]
exclude = ["*.tests", "*.tests.*", "tools.tests", "tools.tests.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "android", "models/dev-stubs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "N818"]  # IPA/click glyphs are intentional; FallbackRequired is a public name

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["models/dev-stubs", "android"]

[tool.pytest.ini_options]
testpaths = ["tests", "engine/python/tests", "desktop/tests", "tools/tests", "tools/parity_web/tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"
markers = [
  "offline: tests that must run with no network",
  "parity: cross-platform parity tests",
  "fault: fault-injection tests",
  "slow: tests excluded from the default fast path",
  "chaos: recovery chaos tests (nightly)",
  "benchmark: pytest-benchmark performance tests (nightly)",
]

[tool.pytest-benchmark]
min_rounds = 5
max_time = 1.0
warmup = true

[tool.coverage.run]
omit = [
  "*/tests/*",
  "*/conftest.py",
]
